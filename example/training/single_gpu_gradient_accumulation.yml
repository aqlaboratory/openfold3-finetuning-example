experiment_settings:
  mode: train
  output_dir: /home/etowah/projects/openfold3-finetune/train_run_acc8
  restart_checkpoint_path: /home/etowah/projects/openfold3/weights/of3-p2-155k.pt
  ckpt_load_settings:
    manual_checkpoint_loading: true
    init_from_ema_weights: false
    restore_lr_scheduler: false
    restore_time_step: false
    strict_loading: false
data_module_args:
  batch_size: 1
  num_workers: 0
  epoch_len: 800
logging_config:
  log_lr: false
  wandb_config: null
pl_trainer_args:
  devices: 1
  num_nodes: 1
  precision: bf16-mixed
  max_epochs: -1
  log_every_n_steps: 1
  max_steps: 8000
  num_sanity_val_steps: 0
checkpoint_config:
  auto_insert_metric_name: false
  save_last: true
  save_top_k: -1
  every_n_epochs: 1
model_update:
  presets:
  - train
  custom:
    architecture:
      shared:
        use_confidence_emb_prob: 0.8
        diffusion:
          use_conditioning_prob: 0.8
    settings:
      memory:
        train:
          use_deepspeed_evo_attention: true
      blocks_per_ckpt: 1
      manual_optimization:
        accumulate_grad_batches: 8
dataset_configs:
  train:
    weighted-pdb:
      dataset_class: WeightedPDBDataset
      weight: 1.0
      config:
        debug_mode: true
        template:
          n_templates: 4
        crop:
          token_crop:
            enabled: true
            token_budget: 384
            crop_weights:
              contiguous: 0.2
              spatial: 0.4
              spatial_interface: 0.4
          chain_crop:
            enabled: true
  validation:
    val-weighted-pdb:
      dataset_class: ValidationPDBDataset
      config:
        debug_mode: true
        msa:
          subsample_main: false
        template:
          n_templates: 4
        crop:
          token_crop:
            enabled: false
dataset_paths:
  weighted-pdb:
    alignments_directory: none
    alignment_db_directory: none
    alignment_array_directory: /home/etowah/projects/openfold3-finetune/a71ev2a/alignment_arrays
    dataset_cache_file: /home/etowah/projects/openfold3-finetune/a71ev2a/caches/train_cache.json
