# Paths below are placeholders. Replace before use:
#   <DATASET_DIR>      prepared dataset root: the --output_dir of runners/prepare_*_data.py
#                      (contains alignment_arrays/, caches/, preprocessed/, merged_cifs/)
#   <OUTPUT_DIR>       where checkpoints and logs are written
#   <CHECKPOINT_PATH>  base model weights to fine-tune from
#   <TEMPLATE_ARRAY_DIR>  any existing directory; required but unused here
experiment_settings:
  mode: train
  output_dir: <OUTPUT_DIR>
  seed: 1272025
  restart_checkpoint_path: <CHECKPOINT_PATH>
  preemption_safe_resume: false
  ckpt_load_settings:
    manual_checkpoint_loading: true
    init_from_ema_weights: true
    restore_lr_scheduler: false
    restore_time_step: false
    strict_loading: true

data_module_args:
  batch_size: 1
  num_workers: 4
  epoch_len: 114

logging_config:
  log_lr: true
  wandb_config:
    project: OpenBind
    entity: aqlab
    group: 2026-04-30-redo
    id: null
    experiment_name: 2-node-finetune-155k

pl_trainer_args:
  devices: 4
  num_nodes: 2
  precision: 32-true
  max_epochs: 1000
  check_val_every_n_epoch: 5
  val_check_interval: 1.0
  log_every_n_steps: 1
  mpi_plugin: false
  deepspeed_config_path: null

checkpoint_config:
  every_n_epochs: 10
  auto_insert_metric_name: false
  save_last: true
  save_top_k: -1

model_update:
  presets:
    - train
  custom:
    settings:
      model_selection_weight_scheme: fine_tuning
      clear_cache_between_steps: true
      ema:
        decay: 0.90
      optimizer:
        learning_rate: 0.0003
      lr_scheduler:
        warmup_no_steps: 200
      memory:
        train:
          msa_module:
            swiglu_seq_chunk_size: null
      debug:
        log_grad_norm: true
        log_extra_grad_metrics: true
    architecture:
      shared:
        diffusion:
          no_samples: 32
      loss_module:
        diffusion:
          chunk_size: 2

dataset_configs:
  train:
    weighted-pdb:
      dataset_class: WeightedPDBDataset
      weight: 1
      config:
        debug_mode: true
        template:
          n_templates: 4
          take_top_k: false
        crop:
          token_crop:
            enabled: true
            token_budget: 768
            crop_weights:
              contiguous: 0.2
              spatial: 0.4
              spatial_interface: 0.4
          chain_crop:
            enabled: true
        loss:
          loss_weights:
            bond: 4.0
            smooth_lddt: 0.0
  validation:
    val-weighted-pdb:
      dataset_class: ValidationPDBDataset
      config:
        debug_mode: true
        msa:
          subsample_main: false
        template:
          n_templates: 4
          take_top_k: true
        crop:
          token_crop:
            enabled: false

dataset_paths:
  weighted-pdb:
    alignments_directory: none
    alignment_db_directory: none
    alignment_array_directory: <DATASET_DIR>/alignment_arrays
    dataset_cache_file: <DATASET_DIR>/caches/train_cache.json
    target_structures_directory: <DATASET_DIR>/preprocessed/structure_files
    target_structure_file_format: npz
    reference_molecule_directory: <DATASET_DIR>/preprocessed/reference_mols
    template_cache_directory: none
    template_structure_array_directory: <TEMPLATE_ARRAY_DIR>
    template_structures_directory: none
    template_file_format: npz
    ccd_file: <DATASET_DIR>/merged_cifs/reference_data/components_harmonized.cif

  val-weighted-pdb:
    alignments_directory: none
    alignment_db_directory: none
    alignment_array_directory: <DATASET_DIR>/alignment_arrays
    dataset_cache_file: <DATASET_DIR>/caches/val_cache.json
    target_structures_directory: <DATASET_DIR>/preprocessed/structure_files
    target_structure_file_format: npz
    reference_molecule_directory: <DATASET_DIR>/preprocessed/reference_mols
    template_cache_directory: none
    template_structure_array_directory: <TEMPLATE_ARRAY_DIR>
    template_structures_directory: none
    template_file_format: npz
    ccd_file: <DATASET_DIR>/merged_cifs/reference_data/components_harmonized.cif
